<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Workout Log · Gym Progress Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121315" />
  <meta name="description" content="Gym Progress Tracker - workouts, plans, progress and reports. Works offline." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymTracker" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js" defer></script>
</head>
<body data-page="workout-log" data-title="Workout Log">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="grid grid-main">
          <div class="card" id="startCard">
            <div class="card-header">
              <div>
                <h3 class="card-title">Start a workout</h3>
                <p class="card-sub">Log today's session, or pick a past date to log a missed one.</p>
              </div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="startDate">Date</label>
                <input type="date" id="startDate" />
              </div>
              <div class="field">
                <label for="startTitle">Title</label>
                <input type="text" id="startTitle" maxlength="60" placeholder="e.g. Push day" />
              </div>
            </div>
            <div class="notice hidden" id="startNotice"></div>
            <div class="btn-row section-gap">
              <button class="btn btn-primary" id="startFromPlan"><i data-lucide="play"></i> <span>Start from plan</span></button>
              <button class="btn" id="startEmpty"><i data-lucide="plus"></i> Start empty</button>
            </div>
          </div>

          <div class="card timer-card">
            <div class="card-header">
              <div>
                <h3 class="card-title">Rest timer</h3>
                <p class="card-sub">Ticking a set as done starts the rest timer automatically.</p>
              </div>
            </div>
            <div class="timer-display" id="timerDisplay">01:30</div>
            <div class="btn-row center" style="justify-content:center">
              <button class="btn btn-sm" data-preset="60">60s</button>
              <button class="btn btn-sm" data-preset="90">90s</button>
              <button class="btn btn-sm" data-preset="120">2 min</button>
              <button class="btn btn-sm" data-preset="180">3 min</button>
            </div>
            <div class="btn-row section-gap" style="justify-content:center">
              <button class="btn btn-primary" id="timerToggle"><i data-lucide="play"></i> <span>Start</span></button>
              <button class="btn" id="timerReset"><i data-lucide="rotate-ccw"></i> Reset</button>
            </div>
          </div>
        </section>

        <section class="card section-gap" id="editorCard">
          <div id="editor"></div>
        </section>

        <section class="card section-gap">
          <div class="card-header">
            <div>
              <h3 class="card-title">Past workouts</h3>
              <p class="card-sub">Select Edit to change a saved workout. Changes save automatically.</p>
            </div>
          </div>
          <div id="history"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/storage.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/workout-log.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
