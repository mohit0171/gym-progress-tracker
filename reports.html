<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Monthly Reports · Gym Progress Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121315" />
  <meta name="description" content="Gym Progress Tracker - workouts, plans, progress and reports. Works offline." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymTracker" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js" defer></script>
</head>
<body data-page="reports" data-title="Monthly Reports">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="card no-print">
          <div class="filter-bar" style="margin-bottom:0">
            <div class="field" style="min-width:200px">
              <label for="reportMonth">Report month</label>
              <input type="month" id="reportMonth" />
            </div>
            <div class="btn-row" style="margin-left:auto">
              <button class="btn" id="exportBtn"><i data-lucide="download"></i> Export backup</button>
              <button class="btn" id="importBtn"><i data-lucide="upload"></i> Import backup</button>
              <input type="file" id="importInput" accept="application/json,.json" class="hidden" />
              <button class="btn btn-primary" id="printBtn"><i data-lucide="printer"></i> Print report</button>
            </div>
          </div>
        </section>

        <section class="grid grid-4 section-gap" id="summaryCards"></section>

        <section class="grid grid-main section-gap">
          <div class="card">
            <div class="card-header"><div><h3 class="card-title">Comparison with previous month</h3><p class="card-sub" id="compareSub"></p></div></div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>Metric</th><th>This month</th><th>Last month</th><th>Change</th></tr></thead>
                <tbody id="compareBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><div><h3 class="card-title">Personal records</h3><p class="card-sub">Heaviest weight beaten this month</p></div></div>
            <div class="list" id="prList"></div>
          </div>
        </section>

        <section class="grid grid-2 section-gap">
          <div class="card">
            <div class="card-header"><div><h3 class="card-title">Body measurements this month</h3><p class="card-sub">Latest entries in the selected month</p></div></div>
            <div class="table-wrap" id="bodyChanges"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title">Exercise performance history</h3>
                <p class="card-sub">Best set per completed workout</p>
              </div>
              <select id="exerciseSelect" style="max-width:240px" class="no-print" aria-label="Choose exercise"></select>
            </div>
            <div class="table-wrap" id="exerciseHistory"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/storage.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/reports.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
